# 자리 '교체 빈도' 구분 — 이 사이트의 자체 기준입니다 (공식 평가·상권 등급 아님).
# 최근 몇 년 이력만 보며, 인허가 개업·폐업 기록만으로 계산한 참고 지표입니다.
years: 10              # 최근 10년 안에 폐업한 가게만 셈
recent_days: 730       # '최근 폐업' = 2년 이내

자주 바뀜:              # 하나라도 맞으면 '자주 바뀜'
  closed_at_least: 4               # 폐업 4회 이상
  closed_2_and_avg_under: 18       # 폐업 2회 이상 + 평균 영업 18개월 미만
  recent_closed_at_least: 2        # 최근 2년 폐업 2회 이상
보통:                   # 하나라도 맞으면 '보통'
  closed_at_least: 2
  avg_under: 24
# 그 외 '오래 유지'
