name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 최신 데이터 합치기
        run: |
          git fetch origin data || true
          mkdir -p web/data
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git --work-tree=web checkout origin/data -- data/ || true
          fi
          rm -f web/data/records.json web/data/stores.json   # 화면에 필요 없는 원본 정리본은 배포하지 않음

      - name: 브이월드 지도 키 넣기 (Secret VWORLD_KEY 가 있을 때만)
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          if [ -n "$VWORLD_KEY" ]; then
            printf 'window.VWORLD_KEY = "%s";\n' "$VWORLD_KEY" > web/config.js
            echo "브이월드 키 적용"
          else
            echo "VWORLD_KEY 없음: 상세 지도는 경계선 그림으로 표시"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
