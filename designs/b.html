<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의정부 자리모아 · 시안 B 연표 목록형</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* 시안 B · 연표 목록형 — 목록 한 줄이 곧 그 자리의 연표. 가게가 바뀐 횟수를 눈으로 바로 비교 */
:root { --ink: #14181d; --ink-2: #48525d; --ink-3: #66717d; --bg: #ffffff; --card: #ffffff; --line: #e6e9ed; --soft: #f3f5f7;
  --accent: #0f766e; --link: #0f766e; --focus: #0f766e; --radius: 10px; --font: "Noto Sans KR", sans-serif; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }
.site-header { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.header-row { display: flex; align-items: center; gap: 18px; height: 60px; }
.logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 9px; }
.logo-mark { display: inline-flex; gap: 2px; }
.logo-mark i { width: 6px; height: 18px; border-radius: 2px; background: var(--accent); }
.logo-mark i:nth-child(2) { background: #8fc9c2; height: 14px; margin-top: 4px; }
.logo-mark i:nth-child(3) { background: #c9e5e1; height: 10px; margin-top: 8px; }
.updated { margin: 0 0 0 auto; font-size: 13px; color: var(--ink-3); }
main.wrap { padding-top: 26px; padding-bottom: 60px; display: flex; flex-direction: column; gap: 18px; }
.intro { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: end; }
.intro h1 { margin: 0; font-size: 30px; letter-spacing: -.8px; line-height: 1.3; }
.intro h1 em { font-style: normal; color: var(--accent); }
#tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile { background: var(--soft); border-radius: var(--radius); padding: 12px 14px; }
.tile:hover { background: #e6f2f0; }
.tile-label { font-size: 12.5px; color: var(--ink-2); }
.tile-num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tools { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; background: var(--soft); border-radius: 14px; }
.search-form { background: #fff; border-radius: var(--radius); padding: 5px 5px 5px 12px; box-shadow: inset 0 0 0 1px var(--line); }
.search-form:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.search-form input { font-size: 16px; padding: 7px 0; }
.search-btn { border: 0; background: var(--ink); color: #fff; font-weight: 700; padding: 9px 20px; border-radius: 7px; cursor: pointer; }
.examples { margin-top: 8px; }
.ex { border: 0; background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.ex:hover { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
#filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.f-sel select { min-width: 120px; padding: 7px 9px; border: 0; border-radius: 7px; background: #fff; font-size: 14px; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.list-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.list-head h2 { margin: 0; font-size: 18px; }
#count { font-weight: 800; color: var(--accent); }
#cond { color: var(--ink-3); font-size: 13px; }
.key { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.k-closed { background: #9fb3c8; } .k-active { background: #0f766e; }
.key i { display: inline-block; width: 16px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
#list { display: flex; flex-direction: column; }
.g-head { position: sticky; top: 60px; background: #fff; padding: 6px 0; border-bottom: 1px solid var(--line); z-index: 2; }
.g-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
.g-row:hover, .g-row:focus-visible { background: #f6faf9; }
.g-track { background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%); border-radius: 3px; }
.more { margin-top: 14px; align-self: center; border: 0; background: var(--ink); color: #fff; border-radius: 8px; padding: 11px 24px; font-weight: 700; }
.site-footer { border-top: 1px solid var(--line); padding: 16px 0 36px; font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 860px) { .intro { grid-template-columns: 1fr; } #tiles { grid-template-columns: repeat(3, 1fr); } .key { margin-left: 0; } }
</style>
</head>
<body>
<header class="site-header"><div class="wrap header-row">
  <div class="logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>의정부 자리모아</div>
  <p class="updated" id="updated">불러오는 중…</p>
</div></header>
<main class="wrap">
  <div class="intro"><h1>막대가 <em>잘게 끊긴 자리</em>는<br>가게가 자주 바뀐 자리입니다</h1><section id="tiles" aria-label="한눈에 보기"></section></div>
  <div class="tools"><section id="search" aria-label="검색"></section><section id="filters" aria-label="조건"></section></div>
  <div class="list-head"><h2>점포 자리 연표</h2><span id="count"></span><span id="cond"></span>
    <span class="key"><span><i class="k-closed"></i>폐업한 가게</span><span><i class="k-active"></i>지금 영업 중</span></span></div>
  <section id="list" aria-live="polite"></section>
</main>
<footer class="site-footer wrap"><p id="source-note"></p><p>의정부시 공식 사이트가 아닙니다. 주의도는 참고 지표이며, 계약 전에는 현장과 건축물대장을 꼭 확인하세요.</p></footer>
<dialog id="detail" aria-labelledby="d-title"></dialog>
<script>window.DESIGN = { list: "gantt", filterStyle: "select", closed: "#9fb3c8", active: "#0f766e", cmpHi: "#0f766e", cmpLo: "#cfe5e2", grid: "#eef1f3", ink: "#14181d", ink2: "#48525d" };</script>
<script src="core.js"></script>
</body>
</html>
